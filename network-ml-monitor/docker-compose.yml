# docker-compose.yml - Rootless services (run with: podman-compose up -d)
version: '3.8'

services:
  flask-app:
    build:
      context: ./flask-app
      dockerfile: Dockerfile.flask
    image: network-ml-monitor-flask:latest
    container_name: flask-app
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/app/logs:Z
      - ./config:/app/config:Z
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    networks:
      - monitor-net

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile.ml
    image: network-ml-monitor-ml:latest
    container_name: ml-service
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:Z
      - ./logs:/app/logs:Z
      - ./config:/app/config:Z
    environment:
      - MODEL_PATH=/app/models/threat_model.pkl
    restart: unless-stopped
    networks:
      - monitor-net

networks:
  monitor-net:
    driver: bridge