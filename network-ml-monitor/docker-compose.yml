services:
  flask-app:
    build:
      context: ./flask-app
      dockerfile: Dockerfile.flask
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - monitor-net

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile.ml
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - monitor-net

  batch-processor:
    build:
      context: ./batch-processor
      dockerfile: Dockerfile.batch
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - ./config:/app/config
    depends_on:
      - ml-service
    networks:
      - monitor-net

  # FIXED: Remove 'networks' when using 'network_mode: host'
packet-sniffer:
  build:
    context: ./packet-sniffer
    dockerfile: Dockerfile.sniffer
  volumes:
    - ./logs:/app/logs
  network_mode: host
  privileged: true
  cap_add:
    - NET_RAW
    - NET_ADMIN
  environment:
    - CAPTURE_INTERFACE=eth0  # Change to your interface
  restart: unless-stopped  # Auto-restart on failure
  healthcheck:
    test: ["CMD", "pgrep", "python"]
    interval: 30s
    timeout: 10s
    retries: 3

networks:
  monitor-net:
    driver: bridge